[project]
name = "weaver-agent-workflow"
version = "0.1.0"
description = "FSR Framework for automated CUDA kernel generation using LLM and iterative refinement"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "numpy>=2.0.0",
    "chromadb>=0.4.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=0.1.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
